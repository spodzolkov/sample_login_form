<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Реєстрація в QA Manual</title>
    <!-- Підключення Tailwind CSS CDN (залишаємо для базових утиліт, які не в style.css) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Підключення нашого файлу стилів -->
    <link rel="stylesheet" href="../CSS/style.css">
    <!-- Шрифт Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4 sm:p-6 md:p-8">
    <div class="card-container">
        <div class="text-center mb-8">
            <h1 class="page-title">Реєстрація</h1>
        </div>

        <form class="space-y-6">
            <!-- Поле для Email -->
            <div>
                <label for="regEmail" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                <input
                    type="email"
                    id="regEmail"
                    name="regEmail"
                    placeholder="example@domain.com"
                    required
                    class="form-input"
                >
            </div>

            <!-- Поле для Password -->
            <div>
                <label for="regPassword" class="block text-sm font-medium text-gray-700 mb-1">Пароль</label>
                <input
                    type="password"
                    id="regPassword"
                    name="regPassword"
                    placeholder="Придумайте пароль"
                    required
                    class="form-input"
                >
            </div>

            <!-- Поле для Confirm Password -->
            <div>
                <label for="confirmPassword" class="block text-sm font-medium text-gray-700 mb-1">Підтвердіть пароль</label>
                <input
                    type="password"
                    id="confirmPassword"
                    name="confirmPassword"
                    placeholder="Повторіть пароль"
                    required
                    class="form-input"
                >
            </div>

            <!-- Кнопка Реєстрації -->
            <div>
                <button
                    type="submit"
                    class="primary-button"
                >
                    Зареєструватися
                </button>
            </div>
        </form>

        <!-- Посилання Назад до входу -->
        <div class="mt-6 text-center">
            <p class="text-sm text-gray-600">
                Вже маєте обліковий запис?
                <a href="../index.html" class="form-link">Увійти</a>
            </p>
        </div>
    </div>
</body>
</html>
